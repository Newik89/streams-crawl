# Проверка перед выкладкой — книга случаев (владелец 13.10.2026: «чтобы не
# повторялись ошибки и не ходить кругами»; «чтоб новое не ломало старое»).
# Идёт на КАЖДЫЙ push кода в любую ветку: все тесты + книга случаев +
# разбор последнего сбора старым и новым кодом (scripts/proverka.py).
# Красный — в main не выкладывать; шлагбаум scripts/push_gate.py на
# компьютере не пустит в main коммит без зелёной проверки здесь.
# Итоги сборов (results/, recon/) проверку не запускают — их пишет обход.
name: Проверка перед выкладкой
run-name: ${{ format('Проверка {0} {1}', github.ref_name, github.sha) }}

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "results/**"
      - "recon/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read      # список прогонов обхода; запас — артефакт obhod-N (до 04.11)

concurrency:
  group: proverka-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proverka:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # старый код для сравнения — из истории

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Библиотеки (точные версии)
        run: pip install -r requirements-crawl.txt -r requirements-proverka.txt

      - name: Какие полные сборы свежие
        # самые свежие удачные полные обходы (плановые или заказ сервера),
        # свежие первыми: первый номер — точный ключ кэша, ещё пять — запасные
        id: kandidaty
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list --workflow crawl.yml --status success --limit 30 \
            --json databaseId,number,displayTitle \
            --jq '.[] | select(.displayTitle | test("^Обход (по расписанию|full-)")) | "\(.databaseId) \(.number)"' > runs.txt
          set -- $(awk '{print $2}' runs.txt | head -6)
          echo "first=sbor-${1:-0}-pages" >> "$GITHUB_OUTPUT"
          if [ $# -gt 0 ]; then shift; fi
          { echo "rest<<EOF"; for n in "$@"; do echo "sbor-$n-pages"; done; echo "EOF"; } >> "$GITHUB_OUTPUT"
          echo "кандидаты: $(awk '{print "#"$2}' runs.txt | head -6 | tr '\n' ' ')"

      - name: Страницы последнего полного сбора — из кэша
        # архив сбора одним файлом (crawl.yml, шаг «Забрать страницы и
        # отчёты», ключ sbor-<номер>-pages); нет точного — ближайший запасной
        id: kesh
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.kandidaty.outputs.first }}
          restore-keys: ${{ steps.kandidaty.outputs.rest }}
          path: obhod.tar.xz

      - name: Страницы последнего полного сбора
        # из кэша — распаковать в sbor/; нет в кэше — запас: сборы до 31.10
        # лежат артефактами obhod-N (живут 3 дня; после 04.11 запас пустой).
        # Не нашёлся — шаг не краснеет сам, но итог ниже будет красным
        id: sbor
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEY: ${{ steps.kesh.outputs.cache-matched-key }}
        run: |
          if [ -f obhod.tar.xz ]; then
            mkdir -p sbor && tar -C sbor --strip-components=1 -xJf obhod.tar.xz
            echo "dir=sbor" >> "$GITHUB_OUTPUT"
            echo "сбор из кэша: $KEY, файлов: $(find sbor -type f | wc -l)"
            exit 0
          fi
          while read -r id num; do
            if gh run download "$id" -n "obhod-$num" -D sbor 2>/dev/null; then
              echo "dir=sbor" >> "$GITHUB_OUTPUT"
              echo "сбор #$num (артефакт старого вида)"
              exit 0
            fi
          done < runs.txt
          echo "::warning::нет живого архива полного сбора — сравнение пропущено"

      - name: Тесты, книга случаев, старый и новый код на сборе
        env:
          BEFORE: ${{ github.event.before }}
          SBOR: ${{ steps.sbor.outputs.dir }}
        run: |
          # старый код: для main — прежняя голова main; для ветки — общий
          # предок с main (иначе свежий код main посчитается потерей ветки)
          base=$(git merge-base origin/main HEAD)
          if [ "$GITHUB_REF_NAME" = "main" ] && [ -n "$BEFORE" ] && \
             [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE"
          fi
          if [ -n "$SBOR" ]; then
            python scripts/proverka.py --sravnit "$SBOR" --base "$base" | tee proverka.txt
            code=${PIPESTATUS[0]}
          else
            python scripts/proverka.py | tee proverka.txt
            code=${PIPESTATUS[0]}
            # без сравнения на сборе проверка неполная — шлагбаум её не примет
            echo "✗ сравнение на последнем сборе НЕ СДЕЛАНО: нет живого архива полного обхода" | tee -a proverka.txt
            code=1
          fi
          { echo '```'; tail -60 proverka.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code
