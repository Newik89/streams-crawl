# Обход телесайтов не с домашнего компьютера, а из GitHub.
#
# Решение владельца от 29.08.2026: домашний IP-адрес не светим, и **ручной
# работы быть не должно**. Поэтому обход ходит сам, каждое утро, и сам же
# кладёт результат в папку `results/` этого репозитория. Кнопка на вкладке
# Actions остаётся — для внеочередного запуска.
#
# Что делает: качает страницы по плану `data/crawl_plan.json`, сразу же их
# разбирает и кладёт результат в артефакт. Итог виден прямо на странице
# запуска — сколько матчей нашлось и не подсунул ли какой-то сайт заглушку
# «подтвердите, что вы человек». Именно это и надо проверить: серверу сайты
# верят хуже, чем домашнему компьютеру.

name: Обход телесайтов
# Название прогона говорит, что это за сбор (05.10.2026): сторож сервера по
# открытому API отличает пробу от обхода на 6 дней (потолок длительности,
# «идёт ли полный не меньшей глубины») — `app/watch.run_kind`. Слова те же,
# что у стука «начали»: proba-2, full-6, site-…, date-…. Это только надпись:
# в команды она не попадает.
run-name: ${{ github.event_name != 'workflow_dispatch' && 'Обход по расписанию' || inputs.from_run != '' && format('Обход reparse-{0}', inputs.from_run) || inputs.mode == 'proba' && format('Обход proba-{0}', inputs.days) || inputs.only != '' && format('Обход site-{0}', inputs.only) || inputs.date != '' && format('Обход date-{0}', inputs.date) || format('Обход {0}-{1}', inputs.mode, inputs.days) }}

on:
  # 09:17 UTC = 12:17 по Киеву летом / 11:17 зимой (06.10.2026; было 04:17
  # UTC = 07:17). Утренний плановый сервера перенесён на 08:15 (programetv.ro
  # и tv.orf.at до ~07:00 своего времени отдают вчерашние телесутки): этот
  # заход должен идти ПОСЛЕ него и его возможного досрочного (оба кончаются
  # до ~11:45), иначе при сорванном вечере вышли бы два полных подряд —
  # 07:17 этот и 08:15 плановый (сервер не знает, соберёт ли этот заход что-
  # то или тихо выйдет). Сейчас свежий утренний результат есть — шаг «Не
  # ходили ли уже сегодня» тихо выходит; сервер утром не смог — это последняя
  # страховка, и до 16:15 он успевает. Минута нарочно некруглая: в :00 у
  # GitHub толпа, такие запуски он чаще пропускает — 31.08 прогон в 04:00
  # просто не состоялся.
  schedule:
    - cron: "17 9 * * *"
    # Запасные заходы 07:43 и 11:11 UTC убраны 03.10.2026 (слово владельца):
    # обход заказывает сервер (08:15 / 16:15 / 20:30 по Киеву), за заказом
    # следит сторож (app/watch.py) — он же повторит заказ и заберёт результат.
    # Этот единственный cron остаётся последней страховкой: если результат
    # дня уже свежий, шаг «Не ходили ли уже сегодня» тихо выходит.
  workflow_dispatch:
    inputs:
      mode:
        description: "proba — по одному адресу на сайт (4 запроса). full — весь план (62 адреса при окне 2 суток)"
        type: choice
        default: "proba"
        options: ["proba", "full"]
      days:
        description: "Окно, суток вперёд (для полного обхода): 2 — дозаправка, 6 — «сегодня + 6» целиком"
        type: choice
        default: "2"
        options: ["2", "5", "6"]
      delay:
        description: "Пауза между запросами к одному сайту, секунд"
        default: "3"
      only:
        description: "Только эти сайты, через запятую (пусто — все)"
        default: ""
      urls:
        description: "Проверить сторонние адреса вместо плана, через запятую (для поиска замены закрытому сайту)"
        default: ""
      post:
        description: "Поля формы k=v&k2=v2 — тогда адреса из urls запрашиваются POST-ом (sport1tv.cz, tvr.ro)"
        default: ""
      readers:
        description: "Проверить читалки (нужны сайтам, закрытым для серверов) и обновить data/readers.json"
        type: choice
        default: "no"
        options: ["no", "yes"]
      warmup:
        description: "Сперва открыть эту страницу той же сессией — для сайтов, которые отдают данные только по куке"
        default: ""
      browser:
        description: "Сразу браузером (для сайтов, где расписание рисует скрипт: sport5.co.il, rtcg.me)"
        type: choice
        default: "no"
        options: ["no", "yes"]
      date:
        description: "Скан одной даты ГГГГ-ММ-ДД (календарь владельца): дневные сетки качаются только за этот день, итог кладётся в results/day/"
        default: ""
      from_run:
        description: "Переразбор без обхода (схема сбоев, шаг 4): id прогона, чьи страницы (артефакт obhod-N, живёт 3 дня) разобрать заново; к сайтам не ходим, итог — в results/partial/"
        default: ""
      code_ref:
        description: "Переразбор кодом другой версии: SHA коммита (пусто — текущий main). Сторож даёт родителя коммита упавшего прогона, когда упал наш разбор"
        default: ""

permissions:
  contents: write        # чтобы обход мог сам положить результат в results/
  issues: write          # провал обхода → issue с меткой «обход-упал» (письмо владельцу)
  actions: read          # переразбор: скачать артефакт страниц прежнего прогона

# Кнопка сайта поверх планового обхода встаёт в очередь, а не идёт рядом
# (аудит 07.09, A2): два обхода разом — двойная нагрузка на сайты и гонка
# за results/. Идущий прогон не обрывается.
concurrency:
  group: crawl-sites
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # 02.09: окно 5 суток — это ~970 адресов и ~50 минут ходьбы с паузами;
    # запас, чтобы кнопка «Collect 5 days» не обрывалась на середине
    # окно 6 суток — это ~1160 адресов с паузой 3 с на хост плюс второй
    # заход по упавшим; 90 минут перестало хватать (аудит 07.09, A8)
    timeout-minutes: 150

    steps:
      - name: Проверка параметров запуска
        # Аудит 05.10.2026: значения формы подставлялись прямо в текст
        # команд — адрес вида `http://x/$(команда)` выполнился бы на раннере.
        # Теперь всё, что пришло извне, едет только через env и в кавычках,
        # а здесь, первым шагом, сверяется с жёстким форматом. Не прошло —
        # шаг красный, и дальше НИЧЕГО не идёт: шаг «Не ходили ли уже
        # сегодня» не выполнится, а все прочие ждут его ответа run == '1'
        # (ни обхода, ни issue, ни стука серверу).
        env:
          EVENT: ${{ github.event_name }}
          IN_MODE: ${{ inputs.mode }}
          IN_DAYS: ${{ inputs.days }}
          IN_DELAY: ${{ inputs.delay }}
          IN_ONLY: ${{ inputs.only }}
          IN_URLS: ${{ inputs.urls }}
          IN_POST: ${{ inputs.post }}
          IN_WARMUP: ${{ inputs.warmup }}
          IN_BROWSER: ${{ inputs.browser }}
          IN_DATE: ${{ inputs.date }}
          IN_FROM_RUN: ${{ inputs.from_run }}
          IN_CODE_REF: ${{ inputs.code_ref }}
        run: |
          if [ "$EVENT" = "schedule" ]; then echo "по расписанию — параметры свои"; exit 0; fi
          # один адрес: http(s), без пробелов, кавычек, `$`, обратной косой,
          # обратных кавычек, | < > и запятой (запятая делит список)
          ONE='https?://[]A-Za-z0-9._~:/?#[@!&()*+;=%{}-]+'
          RE_URL="^${ONE}\$"
          RE_URLS="^${ONE}(,${ONE})*\$"
          RE_POST='^[]A-Za-z0-9._~:/?#[@!&()*+;=%{},-]*$'
          BAD=""
          [[ "$IN_MODE" =~ ^(proba|full)$ ]] || BAD="$BAD mode"
          [[ "$IN_DAYS" =~ ^[1-7]$ ]] || BAD="$BAD days"
          [[ "$IN_DELAY" =~ ^[0-9]{1,3}(\.[0-9]{1,3})?$ ]] || BAD="$BAD delay"
          [[ "$IN_BROWSER" =~ ^(yes|no)$ ]] || BAD="$BAD browser"
          [[ "$IN_ONLY" =~ ^[a-z0-9.,-]*$ ]] && [ ${#IN_ONLY} -le 500 ] || BAD="$BAD only"
          [[ "$IN_DATE" =~ ^([0-9]{4}-[0-9]{2}-[0-9]{2})?$ ]] || BAD="$BAD date"
          # переразбор: id прогона — только цифры, версия кода — только SHA
          [[ "$IN_FROM_RUN" =~ ^[0-9]{0,20}$ ]] || BAD="$BAD from_run"
          [[ "$IN_CODE_REF" =~ ^([0-9a-f]{40})?$ ]] || BAD="$BAD code_ref"
          [[ "$IN_POST" =~ $RE_POST ]] && [ ${#IN_POST} -le 1000 ] || BAD="$BAD post"
          if [ -n "$IN_WARMUP" ]; then
            [[ "$IN_WARMUP" =~ $RE_URL ]] && [ ${#IN_WARMUP} -le 1000 ] || BAD="$BAD warmup"
          fi
          if [ -n "$IN_URLS" ]; then
            # весь список целиком: адрес, запятая, адрес… (перевод строки
            # и любой лишний знак — мимо)
            [[ "$IN_URLS" =~ $RE_URLS ]] && [ ${#IN_URLS} -le 4000 ] || BAD="$BAD urls"
          fi
          if [ -n "$BAD" ]; then
            echo "::error::параметры запуска не прошли проверку формата:$BAD — обход не запускается"
            exit 1
          fi
          echo "параметры в порядке"

      - uses: actions/checkout@v4
        with:
          # переразбор прежней версией кода (схема сбоев, шаг 4): workflow —
          # с main, код — с указанного коммита; пусто — текущий main
          ref: ${{ inputs.code_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Поставить, что нужно
        run: |
          # Все версии закреплены в requirements-crawl.txt (владелец 03.10.2026:
          # «как этого избежать»). До того стояло `pip install …` без версий:
          # вышла selectolax 1.0.0 без прежнего разборщика
          # `selectolax.parser.HTMLParser` (на нём все 50 парсеров), GitHub
          # поставил её сам — разбор падал на импорте, обход #172 покраснел.
          # Обновление библиотек — только правкой этого файла и пробным запуском.
          pip install -r requirements-crawl.txt
          playwright install --with-deps chromium

      - name: Не ходили ли уже сегодня
        id: guard
        run: |
          # По расписанию обход нужен один раз в сутки: результат уже свежий
          # (поле «собрано» в results/games.json моложе 10 ч) — заход
          # пропускаем, он запасной. Раньше смотрели на дату коммита
          # results/report.md, но клон без истории показывал время ЛЮБОГО
          # последнего коммита, и правка документов отменяла обход (аудит
          # 07.09, A2). «Собрано» пишет parse_live.py по часам GitHub (UTC).
          # 14.09: опоздавший плановый заход мог простоять в очереди за ручным
          # обходом, а клон у него взят ДО пуша results — свежесть смотрим по
          # main на GitHub сейчас, а не по своему клону
          RUN=1
          if [ "${{ github.event_name }}" = "schedule" ]; then
            { git fetch -q --depth=1 origin main && git show origin/main:results/games.json > /tmp/games_now.json; } 2>/dev/null \
              || cp results/games.json /tmp/games_now.json
            AGE=$(python scripts/crawl_fetch.py --age /tmp/games_now.json)
            echo "последний результат собран $AGE ч назад"
            if [ "$AGE" -lt 10 ]; then RUN=0; fi
          fi
          echo "run=$RUN" >> $GITHUB_OUTPUT
          if [ "$RUN" = "0" ]; then echo "Обход уже был сегодня — пропускаем."; fi

      - name: Что запускаем
        if: steps.guard.outputs.run == '1'
        id: what
        # значения формы — только через env (аудит 05.10.2026); формат уже
        # сверен первым шагом «Проверка параметров запуска»
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_DAYS: ${{ inputs.days }}
          IN_DELAY: ${{ inputs.delay }}
          IN_ONLY: ${{ inputs.only }}
          IN_URLS: ${{ inputs.urls }}
          IN_POST: ${{ inputs.post }}
          IN_WARMUP: ${{ inputs.warmup }}
          IN_BROWSER: ${{ inputs.browser }}
          IN_DATE: ${{ inputs.date }}
          IN_FROM_RUN: ${{ inputs.from_run }}
          IN_CODE_REF: ${{ inputs.code_ref }}
        run: |
          # По расписанию — всегда полный обход. Руками — как выбрали в форме.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "mode=full" >> $GITHUB_OUTPUT
            # окно планового обхода: 6 суток. Глубина одна на все каналы
            # (владелец 09.09), поэтому окно и решает, на сколько дней
            # видно витрину; при 2 сутках субботние матчи оставались без
            # каналов, хотя сайты их уже показывали (#1348, #1349)
            echo "days=6"    >> $GITHUB_OUTPUT
            echo "delay=3"   >> $GITHUB_OUTPUT
            echo "only="     >> $GITHUB_OUTPUT
            echo "urls="     >> $GITHUB_OUTPUT
            echo "post="     >> $GITHUB_OUTPUT
            echo "warmup="   >> $GITHUB_OUTPUT
            echo "browser=no" >> $GITHUB_OUTPUT
            echo "date="     >> $GITHUB_OUTPUT
            echo "from_run=" >> $GITHUB_OUTPUT
            echo "code_ref=" >> $GITHUB_OUTPUT
          else
            echo "mode=$IN_MODE"     >> $GITHUB_OUTPUT
            echo "days=$IN_DAYS"     >> $GITHUB_OUTPUT
            echo "delay=$IN_DELAY"   >> $GITHUB_OUTPUT
            echo "only=$IN_ONLY"     >> $GITHUB_OUTPUT
            echo "urls=$IN_URLS"     >> $GITHUB_OUTPUT
            echo "post=$IN_POST"     >> $GITHUB_OUTPUT
            echo "warmup=$IN_WARMUP" >> $GITHUB_OUTPUT
            echo "browser=$IN_BROWSER" >> $GITHUB_OUTPUT
            echo "date=$IN_DATE"     >> $GITHUB_OUTPUT
            echo "from_run=$IN_FROM_RUN" >> $GITHUB_OUTPUT
            echo "code_ref=$IN_CODE_REF" >> $GITHUB_OUTPUT
          fi

      - name: Стук серверу — начали
        # владелец 14.09: пока сбор идёт, кнопки сайта второй не запускают.
        # Само слово по сети не ездит — только подпись (scripts/knock.sh)
        if: steps.guard.outputs.run == '1'
        continue-on-error: true
        env:
          HOOK_SECRET: ${{ secrets.CRAWL_HOOK_SECRET }}
          HOOK_URL: ${{ secrets.CRAWL_HOOK_URL }}
          W_MODE: ${{ steps.what.outputs.mode }}
          W_DAYS: ${{ steps.what.outputs.days }}
          W_DATE: ${{ steps.what.outputs.date }}
          W_ONLY: ${{ steps.what.outputs.only }}
          W_FROM_RUN: ${{ steps.what.outputs.from_run }}
        run: |
          WHAT="$W_MODE-$W_DAYS"
          [ -n "$W_DATE" ] && WHAT="date-$W_DATE"
          [ -n "$W_ONLY" ] && WHAT="site-$W_ONLY"
          [ -n "$W_FROM_RUN" ] && WHAT="reparse-$W_FROM_RUN"
          export WHAT
          sh scripts/knock.sh start

      - name: Самопроверка окружения
        id: env
        # До обхода: парсеры и разбор должны хотя бы загрузиться. 03.10 о
        # сломанной библиотеке узнали только ПОСЛЕ 80 минут обхода, на шаге
        # разбора. Теперь сломанное окружение краснеет за секунду и к сайтам
        # не идёт вовсе. Стоит после стука «начали»: при провале работают те
        # же оповещения, что и у обхода (issue владельцу, стук «закончили»).
        if: steps.guard.outputs.run == '1'
        run: |
          python -c "import app.parsers as p; p._load_all(); print('парсеры загрузились')"
          python scripts/parse_live.py --help > /dev/null
          echo "разбор загружается"

      - name: Проверка читалок
        id: readers
        if: github.event_name == 'schedule' || inputs.readers == 'yes'
        continue-on-error: true
        run: python scripts/check_readers.py

      - name: Какой сбор переразбираем
        id: prior
        # переразбор без обхода (схема сбоев, шаг 4; сторож сервера,
        # `watch.RECOVERY` → reparse): к сайтам не ходим — страницы берём из
        # артефакта упавшего прогона. Окно дней — из его названия («Обход
        # full-6»): переразбор только полного обхода (у него и страницы, и
        # порог). Прогон другого workflow или не полный — красный, к сайтам
        # всё равно не идём
        if: steps.guard.outputs.run == '1' && steps.what.outputs.from_run != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          W_FROM_RUN: ${{ steps.what.outputs.from_run }}
        run: |
          API="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$W_FROM_RUN"
          CODE=$(curl -s -o /tmp/prior.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API")
          if [ "$CODE" != "200" ]; then
            echo "::error::прогон $W_FROM_RUN не найден (ответ $CODE)"; exit 1
          fi
          TITLE=$(jq -r '.display_title // ""' /tmp/prior.json)
          RUN_PATH=$(jq -r '.path // ""' /tmp/prior.json)
          NUMBER=$(jq -r '.run_number // ""' /tmp/prior.json)
          echo "прежний прогон #$NUMBER: «$TITLE» ($RUN_PATH)"
          if [ "${RUN_PATH%%@*}" != ".github/workflows/crawl.yml" ]; then
            echo "::error::прогон $W_FROM_RUN — не обход сайтов, переразбирать нечего"; exit 1
          fi
          DAYS=""
          case "$TITLE" in
            "Обход full-"[1-7]*) DAYS=${TITLE#Обход full-}; DAYS=${DAYS%%[!0-9]*} ;;
          esac
          if [ -z "$DAYS" ]; then
            echo "::error::переразбор только полного обхода (full-N), а это «$TITLE»"; exit 1
          fi
          echo "окно того сбора: $DAYS сут."
          echo "days=$DAYS"      >> $GITHUB_OUTPUT
          echo "number=$NUMBER"  >> $GITHUB_OUTPUT

      - name: Страницы прежнего сбора
        id: pages
        # артефакт obhod-<номер> того прогона (шаг «Забрать страницы и
        # отчёты», живёт 3 дня) — в ту же папку, куда кладёт их обход.
        # Артефакта уже нет — шаг красный, причина стука «pages»
        if: steps.guard.outputs.run == '1' && steps.what.outputs.from_run != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.what.outputs.from_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: obhod-*
          merge-multiple: true
          path: recon/raw_live

      - name: Обход
        id: fetch
        # при переразборе пропущен: страницы уже на месте, к сайтам не ходим
        if: steps.guard.outputs.run == '1' && steps.what.outputs.from_run == ''
        # значения — только через env и в кавычках (аудит 05.10.2026);
        # `set -f`: в адресах бывают `?` `*` `[` — оболочка не должна
        # принимать их за маску имён файлов
        env:
          W_MODE: ${{ steps.what.outputs.mode }}
          W_DAYS: ${{ steps.what.outputs.days }}
          W_DELAY: ${{ steps.what.outputs.delay }}
          W_ONLY: ${{ steps.what.outputs.only }}
          W_URLS: ${{ steps.what.outputs.urls }}
          W_POST: ${{ steps.what.outputs.post }}
          W_WARMUP: ${{ steps.what.outputs.warmup }}
          W_BROWSER: ${{ steps.what.outputs.browser }}
          W_DATE: ${{ steps.what.outputs.date }}
        run: |
          set -f
          ONLY=""
          if [ -n "$W_ONLY" ]; then ONLY="--only $W_ONLY"; fi
          BROWSER=""
          if [ "$W_BROWSER" = "yes" ]; then BROWSER="--browser"; fi
          POST=""
          if [ -n "$W_POST" ]; then POST="--post $W_POST"; fi
          WARMUP=""
          if [ -n "$W_WARMUP" ]; then WARMUP="--warmup $W_WARMUP"; fi
          # обход по расписанию: сайты с пометкой «только по кнопке» в него не
          # идут (решение владельца 10.09 по случаю mojtv.hr — сайт закрылся
          # после того, как заходов стало больше)
          PLANNED=""
          if [ "${{ github.event_name }}" = "schedule" ]; then PLANNED="--scheduled"; fi
          if [ -n "$W_URLS" ]; then
            python scripts/crawl_fetch.py --urls "$W_URLS" --delay "$W_DELAY" $POST $WARMUP $BROWSER
            exit 0
          fi
          if [ -n "$W_DATE" ]; then
            python scripts/crawl_fetch.py --full --date "$W_DATE" --delay "$W_DELAY" $ONLY $BROWSER $PLANNED
          elif [ "$W_MODE" = "full" ]; then
            python scripts/crawl_fetch.py --full --days "$W_DAYS" --delay "$W_DELAY" $ONLY $BROWSER $PLANNED
          else
            python scripts/crawl_fetch.py --probe --delay "$W_DELAY" $ONLY $BROWSER $PLANNED
          fi

      - name: Разобрать скачанное
        id: parse
        # `always()`: и после красного обхода разбор нужен — итог и артефакт
        # покажут, что успело прийти. В репозиторий это уже не поедет (ниже).
        # `--strict` (игр меньше порога — красный) — только полному обходу без
        # фильтров, как и оценка в самом crawl_fetch.py
        if: always() && steps.guard.outputs.run == '1'
        env:
          W_MODE: ${{ steps.what.outputs.mode }}
          W_DAYS: ${{ steps.what.outputs.days }}
          W_ONLY: ${{ steps.what.outputs.only }}
          W_URLS: ${{ steps.what.outputs.urls }}
          W_DATE: ${{ steps.what.outputs.date }}
          W_FROM_RUN: ${{ steps.what.outputs.from_run }}
          P_DAYS: ${{ steps.prior.outputs.days }}
        run: |
          STRICT=""
          if [ "$W_MODE" = "full" ] && [ -z "$W_ONLY$W_URLS$W_DATE$W_FROM_RUN" ]; then
            STRICT="--strict"
          fi
          # переразбор: окно — того сбора, чьи страницы разбираем; без
          # --strict (итог частичный, его порог не судит) — в results/partial/
          DAYS="$W_DAYS"
          [ -n "$W_FROM_RUN" ] && DAYS="$P_DAYS"
          if [ -n "$W_DATE" ]; then
            python scripts/parse_live.py --date "$W_DATE"
          else
            python scripts/parse_live.py --days "$DAYS" $STRICT
          fi

      - name: Самопроверка прогона
        # известные классы наших ошибок списком (владелец 06.10: «чтобы не
        # ходить кругами»): итог едет с результатом (audit.json рядом с
        # games.json) и ложится строкой в «Прогоны» админки. Полному обходу —
        # сравнение с прошлым results/games.json (он ещё не заменён). Обход
        # не краснеет: подозрение — повод посмотреть, а не провал
        if: always() && steps.guard.outputs.run == '1'
        continue-on-error: true
        env:
          W_MODE: ${{ steps.what.outputs.mode }}
          W_ONLY: ${{ steps.what.outputs.only }}
          W_URLS: ${{ steps.what.outputs.urls }}
          W_DATE: ${{ steps.what.outputs.date }}
          W_FROM_RUN: ${{ steps.what.outputs.from_run }}
        run: |
          PREV=""
          if [ "$W_MODE" = "full" ] && [ -z "$W_ONLY$W_URLS$W_DATE$W_FROM_RUN" ] && [ -f results/games.json ]; then
            PREV="--prev results"
          fi
          python scripts/audit_run.py --dir recon/raw_live $PREV --md recon/raw_live/audit.md --json recon/raw_live/audit.json
          echo ""                       >> $GITHUB_STEP_SUMMARY
          cat recon/raw_live/audit.md   >> $GITHUB_STEP_SUMMARY || true

      - name: AI-слой — самопочинка и запасной разбор (рубильник STREAMS_AI)
        # бесплатная модель GitHub чинит несложные поломки разметки сама и
        # достаёт матчи со страниц, которые парсер не осилил; выключается
        # переменной репозитория STREAMS_AI (решение владельца 02.09)
        if: always() && steps.guard.outputs.run == '1' && vars.STREAMS_AI == 'on'
        env:
          STREAMS_AI: "on"
          AI_API_KEY: ${{ secrets.STREAMS_AI_KEY }}
          AI_DAYS: ${{ steps.what.outputs.days }}
        run: |
          python scripts/ai_repair.py --auto || true
          python scripts/ai_fallback.py --run --merge || true

      - name: Показать итог прямо здесь
        if: always() && steps.guard.outputs.run == '1'
        run: |
          cat recon/raw_live/report.md   >> $GITHUB_STEP_SUMMARY || true
          echo ""                        >> $GITHUB_STEP_SUMMARY
          cat recon/raw_live/matches.md  >> $GITHUB_STEP_SUMMARY || true

      - name: Положить скан даты в репозиторий
        # календарь владельца (05.09): итог одного дня едет отдельной папкой
        # results/day/ и полного не затирает; сервер вливает его вдобавок.
        # Без `always()`: упал обход или разбор — старый итог остаётся (A4)
        if: steps.guard.outputs.run == '1' && steps.what.outputs.date != ''
        env:
          W_DATE: ${{ steps.what.outputs.date }}
        run: |
          mkdir -p results/day
          cp recon/raw_live/games.json  results/day/ 2>/dev/null || true
          cp recon/raw_live/report.json results/day/ 2>/dev/null || true
          cp recon/raw_live/audit.json  results/day/ 2>/dev/null || true
          git config user.name  "Обход телесайтов"
          git config user.email "actions@github.com"
          git add results/day/
          git diff --cached --quiet || git commit -m "Скан даты $W_DATE — $(date -u +%d.%m.%Y\ %H:%M) UTC"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done
          echo "::error::скан даты не запушился за 3 попытки"
          exit 1

      - name: Положить точечный обход в репозиторий
        # кнопка «Обойти сайт» (владелец 20.09): итог одного сайта едет
        # отдельной папкой results/site/ и полного не затирает; сервер
        # вливает его вдобавок, чужие каналы такой прогон не гасит (A7 —
        # заливка видит по report.json, какие домены отработали).
        # Без `always()`: упал обход или разбор — старого итога не портим (A4)
        if: steps.guard.outputs.run == '1' && steps.what.outputs.mode == 'full' && steps.what.outputs.only != '' && steps.what.outputs.urls == '' && steps.what.outputs.date == ''
        env:
          W_ONLY: ${{ steps.what.outputs.only }}
        run: |
          # оба файла обязательны: games.json БЕЗ report.json заливка приняла
          # бы со worked=None и погасила метки чужих сайтов (обход A7)
          if [ ! -f recon/raw_live/games.json ] || [ ! -f recon/raw_live/report.json ]; then
            echo "пары games+report нет — класть нечего"; exit 0
          fi
          mkdir -p results/site
          cp recon/raw_live/games.json  results/site/
          cp recon/raw_live/report.json results/site/
          cp recon/raw_live/audit.json  results/site/ 2>/dev/null || true
          git config user.name  "Обход телесайтов"
          git config user.email "actions@github.com"
          git add results/site/
          git diff --cached --quiet || git commit -m "Точечный обход $W_ONLY — $(date -u +%d.%m.%Y\ %H:%M) UTC"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done
          echo "::error::точечный обход не запушился за 3 попытки"
          exit 1

      - name: Положить результат в репозиторий
        id: push
        # только ПОЛНЫЙ обход без фильтров: проба (--urls, proba) и точечный
        # `--only` не должны затирать results/ полного дня своим маленьким
        # games.json (02.09 затирали дважды — проба и обкатка flashscore).
        # И только УДАЧНЫЙ: без `always()` шаг не идёт после красного обхода,
        # красного разбора или таймаута — урезанный результат больше не
        # ложится поверх хорошего (аудит 07.09, A4)
        if: steps.guard.outputs.run == '1' && steps.what.outputs.mode == 'full' && steps.what.outputs.only == '' && steps.what.outputs.urls == '' && steps.what.outputs.date == '' && steps.what.outputs.from_run == ''
        run: |
          # Сами страницы не храним — они тяжёлые и живут в артефакте.
          # В репозиторий кладём только два отчёта: что ответили сайты и
          # какие матчи нашлись. Так свежий список всегда под рукой.
          mkdir -p results
          cp recon/raw_live/report.md  results/  2>/dev/null || true
          cp recon/raw_live/matches.md results/  2>/dev/null || true
          cp recon/raw_live/report.json results/ 2>/dev/null || true
          cp recon/raw_live/games.json  results/ 2>/dev/null || true
          cp recon/raw_live/audit.json  results/ 2>/dev/null || true
          git config user.name  "Обход телесайтов"
          git config user.email "actions@github.com"
          git add results/
          # список живых читалок обновляет шаг «Проверка читалок» — он тоже
          # едет в репозиторий, иначе следующий обход о нём не узнает
          git add data/readers.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Обход $(date -u +%d.%m.%Y\ %H:%M) UTC"
          # Пока обход шёл, в main могли запушить с компьютера (02.09 так
          # пропал итог полного обхода: push отбило, «|| true» смолчал).
          # Поэтому: подтянуть чужие коммиты ребейзом и попробовать ещё раз,
          # а не вышло — упасть громко, чтобы пропажу результата было видно.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done
          echo "::error::результат обхода не запушился за 3 попытки"
          exit 1

      - name: Положить переразбор в репозиторий
        id: push_partial
        # переразбор (схема сбоев, шаг 4): итог едет папкой results/partial/
        # и полного не затирает — иначе частичный results/games.json занизил
        # бы порог `previous_counts` следующему обходу. Сервер вливает его
        # вдобавок (streams-update.sh), каналы гасит только по report.json
        # того же сбора. Без `always()`: упал разбор — класть нечего.
        # Код мог быть взят с прежнего коммита (code_ref) — коммит кладём
        # поверх свежего main, а не поверх старого кода
        if: steps.guard.outputs.run == '1' && steps.what.outputs.from_run != ''
        env:
          P_NUMBER: ${{ steps.prior.outputs.number }}
        run: |
          if [ ! -f recon/raw_live/games.json ] || [ ! -f recon/raw_live/report.json ]; then
            echo "::error::пары games+report нет — переразбор ничего не дал"; exit 1
          fi
          rm -rf /tmp/partial && mkdir -p /tmp/partial
          cp recon/raw_live/games.json  /tmp/partial/
          cp recon/raw_live/report.json /tmp/partial/
          cp recon/raw_live/audit.json  /tmp/partial/ 2>/dev/null || true
          git config user.name  "Обход телесайтов"
          git config user.email "actions@github.com"
          git fetch -q origin main
          git checkout -q -B main origin/main
          mkdir -p results/partial
          cp /tmp/partial/* results/partial/
          git add results/partial/
          git diff --cached --quiet || git commit -m "Переразбор сбора #$P_NUMBER — $(date -u +%d.%m.%Y\ %H:%M) UTC"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          echo "::error::переразбор не запушился за 3 попытки"
          exit 1

      - name: Забрать страницы и отчёты
        # при переразборе не кладём: те же страницы уже лежат артефактом
        # прежнего прогона, второй экземпляр только забил бы хранилище
        if: always() && steps.guard.outputs.run == '1' && steps.what.outputs.from_run == ''
        # архив страниц нужен только для отладки: переполнилось хранилище
        # Actions (02.10 — 582 МБ при лимите 500) — обход не должен из-за
        # этого краснеть, стучать «провал» и заставлять сторожа перезаказывать
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: obhod-${{ github.run_number }}
          path: recon/raw_live/
          # 3 дня, не 7: хранилище Actions 0,5 ГБ считается и для публичного
          # репо — при 7 днях подходили к 90% (письмо GitHub 29.09)
          retention-days: 3

      - name: Дозор — сайт снова пускает
        # закрытый сайт стоит в обходе одним заходом в сутки; ответил
        # расписанием — владельцу уходит письмо (решение владельца 09.09)
        if: success() && steps.guard.outputs.run == '1' && steps.what.outputs.from_run == ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python scripts/crawl_alarm.py --watch
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Провал — issue владельцу
        # Письмо GitHub о красном прогоне приходит не всегда: запуск от бота
        # queue.yml (кнопки сайта) — никому. Issue с меткой «обход-упал»
        # доходит письмом всегда; открытая уже есть — туда комментарий.
        # `cancelled()` — таймаут job'а тоже провал (аудит 07.09, A4)
        if: (failure() || cancelled()) && steps.guard.outputs.run == '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          W_MODE: ${{ steps.what.outputs.mode }}
          W_DAYS: ${{ steps.what.outputs.days }}
          W_ONLY: ${{ steps.what.outputs.only }}
          W_DATE: ${{ steps.what.outputs.date }}
          W_FROM_RUN: ${{ steps.what.outputs.from_run }}
        run: >
          python scripts/crawl_alarm.py
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --mode "$W_MODE, окно $W_DAYS сут., only=$W_ONLY, date=$W_DATE, from_run=$W_FROM_RUN, запуск: ${{ github.event_name }}"

      - name: Стук серверу — закончили
        # владелец 14.09: сервер по стуку сам забирает результат (заборы по
        # часам остались страховкой). И после провала стучим — иначе кнопки
        # остались бы запертыми до истечения замка
        if: always() && steps.guard.outputs.run == '1'
        continue-on-error: true
        env:
          HOOK_SECRET: ${{ secrets.CRAWL_HOOK_SECRET }}
          HOOK_URL: ${{ secrets.CRAWL_HOOK_URL }}
          W_MODE: ${{ steps.what.outputs.mode }}
          W_DAYS: ${{ steps.what.outputs.days }}
          W_DATE: ${{ steps.what.outputs.date }}
          W_ONLY: ${{ steps.what.outputs.only }}
          W_URLS: ${{ steps.what.outputs.urls }}
          W_FROM_RUN: ${{ steps.what.outputs.from_run }}
          # причина провала — для сторожа (схема сбоев, шаг 3): итоги шагов
          STEP_ENV: ${{ steps.env.outcome }}
          STEP_READERS: ${{ steps.readers.outcome }}
          STEP_FETCH: ${{ steps.fetch.outcome }}
          STEP_PARSE: ${{ steps.parse.outcome }}
          STEP_PUSH: ${{ steps.push.outcome }}
          # переразбор (шаг 4): страницы прежнего сбора и его пуш
          STEP_PRIOR: ${{ steps.prior.outcome }}
          STEP_PAGES: ${{ steps.pages.outcome }}
          STEP_PUSH_PARTIAL: ${{ steps.push_partial.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          WHAT="$W_MODE-$W_DAYS"
          [ -n "$W_DATE" ] && WHAT="date-$W_DATE"
          [ -n "$W_ONLY" ] && WHAT="site-$W_ONLY"
          if [ -n "$W_FROM_RUN" ]; then
            WHAT="reparse-$W_FROM_RUN"
            # у переразбора свой шаг пуша — его итог и есть «push» для причины
            export STEP_PUSH="$STEP_PUSH_PARTIAL"
          fi
          if [ -n "$W_URLS" ]; then
            # проверка адреса кнопкой админки (владелец 20.09): в стук кладём
            # итог пробы — сервер покажет его на странице сбоев
            SUMMARY=$(python scripts/probe_summary.py || echo no-answer)
            WHAT="probeurl-$SUMMARY"
          fi
          export WHAT
          EVENT=done-fail
          REASON=""
          [ "${{ job.status }}" = "success" ] && EVENT=done-ok
          # провал: одним словом, почему (scripts/fail_reason.py) — сторож на
          # сервере по нему решает, заказывать ли ещё один полный сбор
          [ "$EVENT" = "done-fail" ] && REASON=$(python scripts/fail_reason.py 2>/dev/null || echo unknown)
          export REASON
          echo "причина: ${REASON:-—}"
          sh scripts/knock.sh $EVENT
