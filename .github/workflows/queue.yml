# Кнопки сайта без ключа GitHub на сервере (05.09.2026): сервер пушит
# пустой тег-заявку `btn-…` своим деплой-ключом (write), этот workflow
# ловит тег, запускает обход crawl.yml и удаляет тег. Секреты по сети не
# ездят — тег это просто имя:
#   btn-days-2-<ts>            → полный обход, окно 2 суток
#   btn-days-5-<ts>            → полный обход, окно 5 дней
#   btn-days-6-<ts>            → полный обход, «сегодня + 6» целиком (аудит 07.09)
#   btn-date-2026-09-10-<ts>   → скан одной даты
#   btn-site-<домен base32>-<ts> → точечный обход одного сайта (кнопка 20.09)
#   btn-cancel-<id прогона>-<ts> → отменить зависший прогон обхода (сторож, 05.10)
#   btn-reparse-<id прогона>[-prev]-<ts> → переразбор страниц упавшего прогона без
#                                обхода (сторож, схема сбоев шаг 4, 10.10); «prev» —
#                                кодом прежней версии
name: Кнопки сайта

on:
  push:
    tags: ["btn-*"]

permissions:
  actions: write
  contents: write   # удалить тег-заявку после запуска

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Разобрать тег и запустить обход
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "заявка: $TAG"
          KIND=$(echo "$TAG" | cut -d- -f2)
          if [ "$KIND" = "date" ]; then
            VALUE=$(echo "$TAG" | cut -d- -f3-5)
            # аудит 05.10.2026: дата из имени тега — только ГГГГ-ММ-ДД, иначе
            # чужой текст уехал бы в JSON заявки и дальше в обход
            if ! [[ "$VALUE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::дата «$VALUE» не в формате ГГГГ-ММ-ДД — заявка отвергнута"; exit 1
            fi
            INPUTS="{\"mode\":\"full\",\"days\":\"2\",\"delay\":\"3\",\"only\":\"\",\"urls\":\"\",\"date\":\"$VALUE\"}"
          elif [ "$KIND" = "days" ]; then
            VALUE=$(echo "$TAG" | cut -d- -f3)
            # список окон тот же, что у crawl.yml (days): с чужим значением
            # GitHub отверг бы dispatch, а тег остался бы висеть
            case "$VALUE" in
              2|5|6) ;;
              *) echo "окно «$VALUE» не из списка 2/5/6 — выходим"; exit 0 ;;
            esac
            INPUTS="{\"mode\":\"full\",\"days\":\"$VALUE\",\"delay\":\"3\",\"only\":\"\",\"urls\":\"\"}"
          elif [ "$KIND" = "probeurl" ]; then
            # проверка адреса кнопкой админки (владелец 20.09): адрес зашит
            # в тег base32-ой (слэши в имени тега жить не могут); дописываем
            # съеденное «=» и разжимаем
            PACKED=$(echo "$TAG" | cut -d- -f3)
            PAD=$(( (8 - ${#PACKED} % 8) % 8 ))
            PADDING=""
            if [ "$PAD" -gt 0 ]; then PADDING=$(head -c "$PAD" /dev/zero | tr '\0' '='); fi
            URL=$(printf '%s%s' "$PACKED" "$PADDING" | base32 -d 2>/dev/null || true)
            case "$URL" in
              http://*|https://*) ;;
              *) echo "в заявке не адрес — выходим"; exit 0 ;;
            esac
            # аудит 05.10.2026: тот же жёсткий формат, что у crawl.yml —
            # без пробелов, кавычек, `$`, обратной косой, | < > и запятой
            RE_URL='^https?://[]A-Za-z0-9._~:/?#[@!&()*+;=%{}-]+$'
            if ! [[ "$URL" =~ $RE_URL ]] || [ ${#URL} -gt 500 ]; then
              echo "::error::адрес в заявке не прошёл проверку формата — заявка отвергнута"; exit 1
            fi
            URL_JSON=$(printf '%s' "$URL" | sed 's/"/\\"/g')
            INPUTS="{\"mode\":\"proba\",\"days\":\"2\",\"delay\":\"3\",\"only\":\"\",\"urls\":\"$URL_JSON\"}"
          elif [ "$KIND" = "site" ]; then
            # точечный обход одного сайта кнопкой админки (владелец 20.09):
            # домен зашит в тег base32-ой, как адрес у probeurl
            PACKED=$(echo "$TAG" | cut -d- -f3)
            PAD=$(( (8 - ${#PACKED} % 8) % 8 ))
            PADDING=""
            if [ "$PAD" -gt 0 ]; then PADDING=$(head -c "$PAD" /dev/zero | tr '\0' '='); fi
            SITE=$(printf '%s%s' "$PACKED" "$PADDING" | base32 -d 2>/dev/null || true)
            case "$SITE" in
              ""|*[!a-z0-9.-]*) echo "в заявке не домен — выходим"; exit 0 ;;
            esac
            # окно 6 дней: сайт пересобирается целиком, как утренним обходом
            INPUTS="{\"mode\":\"full\",\"days\":\"6\",\"delay\":\"3\",\"only\":\"$SITE\",\"urls\":\"\"}"
          elif [ "$KIND" = "reparse" ]; then
            # переразбор без обхода (сторож, схема сбоев шаг 4): страницы
            # упавшего прогона разбираются заново, к сайтам не ходим. Номер
            # прогона — только цифры, иначе отказ. «prev» — кодом прежней
            # версии: каждая выкладка — слияние в main, а поверх слияния
            # ложатся коммиты бота (results/, словари) — поэтому не родитель
            # коммита прогона, а первый родитель БЛИЖАЙШЕГО слияния в его
            # истории (= main до той выкладки; проверка 10.10). Слияний нет
            # (код пушили напрямую) — родитель последнего коммита, трогавшего
            # app/ или scripts/
            RUN_ID=$(echo "$TAG" | cut -d- -f3)
            FLAG=$(echo "$TAG" | cut -d- -f4)
            if ! [[ "$RUN_ID" =~ ^[0-9]{1,20}$ ]]; then
              echo "::error::номер прогона не из одних цифр — заявка отвергнута"; exit 1
            fi
            CODE_REF=""
            if [ "$FLAG" = "prev" ]; then
              RUN_API="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
              CODE=$(curl -s -o /tmp/run -w "%{http_code}" \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github+json" "$RUN_API")
              if [ "$CODE" != "200" ]; then
                echo "::error::прогон $RUN_ID не найден (ответ $CODE)"; exit 1
              fi
              SHA=$(jq -r '.head_sha // ""' /tmp/run)
              if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::у прогона $RUN_ID нет коммита — заявка отвергнута"; exit 1
              fi
              COMMITS="https://api.github.com/repos/$GITHUB_REPOSITORY/commits"
              CODE=$(curl -s -o /tmp/history -w "%{http_code}" \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                "$COMMITS?sha=$SHA&per_page=60")
              if [ "$CODE" != "200" ]; then
                echo "::error::история коммита $SHA не прочиталась (ответ $CODE)"; exit 1
              fi
              MERGE=$(jq -r '[.[] | select(.parents | length > 1)][0].sha // ""' /tmp/history)
              if [[ "$MERGE" =~ ^[0-9a-f]{40}$ ]]; then
                CODE_REF=$(jq -r --arg m "$MERGE" '.[] | select(.sha == $m) | .parents[0].sha // ""' /tmp/history)
                echo "ближайшее слияние в истории $SHA: $MERGE"
              else
                LAST=""
                for P in app scripts; do
                  curl -s -o /tmp/touch -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                    -H "Accept: application/vnd.github+json" "$COMMITS?sha=$SHA&path=$P&per_page=1"
                  ONE=$(jq -r '.[0] | "\(.commit.committer.date) \(.parents[0].sha // "")"' /tmp/touch 2>/dev/null)
                  [ "$ONE" \> "$LAST" ] && LAST="$ONE"
                done
                CODE_REF=${LAST##* }
                echo "слияний нет — родитель последнего коммита по коду: $LAST"
              fi
              if ! [[ "$CODE_REF" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::прежняя версия кода для $SHA не найдена"; exit 1
              fi
              echo "прежняя версия кода: $CODE_REF"
            fi
            INPUTS="{\"mode\":\"full\",\"days\":\"6\",\"delay\":\"3\",\"only\":\"\",\"urls\":\"\",\"from_run\":\"$RUN_ID\",\"code_ref\":\"$CODE_REF\"}"
          elif [ "$KIND" = "cancel" ]; then
            # отмена зависшего прогона обхода сторожем сервера (05.10.2026):
            # у сервера нет ключа GitHub, отменяет этот workflow своим
            # GITHUB_TOKEN. Номер прогона — только цифры, иначе отказ; и
            # отменяем только прогон обхода (crawl.yml) этого же репозитория:
            # адрес API и так в пределах репозитория, путь workflow сверяем
            # по ответу GitHub
            RUN_ID=$(echo "$TAG" | cut -d- -f3)
            if ! [[ "$RUN_ID" =~ ^[0-9]{1,20}$ ]]; then
              echo "::error::номер прогона не из одних цифр — заявка отвергнута"; exit 1
            fi
            RUN_API="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
            CODE=$(curl -s -o /tmp/run -w "%{http_code}" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" "$RUN_API")
            if [ "$CODE" != "200" ]; then
              echo "::error::прогон $RUN_ID не найден (ответ $CODE)"; exit 1
            fi
            RUN_PATH=$(jq -r '.path // ""' /tmp/run)
            RUN_STATUS=$(jq -r '.status // ""' /tmp/run)
            echo "прогон $RUN_ID: $RUN_PATH, $RUN_STATUS"
            if [ "${RUN_PATH%%@*}" != ".github/workflows/crawl.yml" ]; then
              echo "::error::прогон $RUN_ID — не обход сайтов, не отменяю"; exit 1
            fi
            if [ "$RUN_STATUS" = "completed" ]; then
              echo "прогон уже закончился — отменять нечего"; exit 0
            fi
            CODE=$(curl -s -o /tmp/answer -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" "$RUN_API/cancel")
            echo "cancel: $CODE"; cat /tmp/answer || true
            [ "$CODE" = "202" ] || exit 1
            exit 0
          else
            echo "непонятная заявка — выходим"; exit 0
          fi
          CODE=$(curl -s -o /tmp/answer -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/crawl.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":$INPUTS}")
          echo "dispatch: $CODE"; cat /tmp/answer || true
          [ "$CODE" = "204" ] || exit 1

      - name: Удалить тег-заявку
        if: always()
        # --globoff (05.10): в имени тега могут быть { } — без него curl
        # счёл бы их шаблоном адреса и удалял бы не тот тег
        run: |
          curl -s --globoff -X DELETE \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/git/${GITHUB_REF}" \
            -o /dev/null || true
